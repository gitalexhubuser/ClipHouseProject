name: "ClipHouse — общий буфер"
slug: "cliphouse"
version: "4.1.0"
description: >-
  Локальный общий текстовый буфер с SQLite-историей,
  избранным и синхронизацией между устройствами в домашней сети.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
webui: "http://[HOST]:8787/"  
options:
  max_text_chars: 100000
schema:
  max_text_chars: int
