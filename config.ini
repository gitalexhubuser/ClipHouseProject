; ClipHouse: настройки сервера и локальной истории
; Изменения применяются после перезапуска Start_ClipHouse.bat.

[server]
; HTTP-порт страницы. Оставь 8787, если нет конфликта с другой программой.
http_port = 8787
; UDP-порт для обнаружения других экземпляров ClipHouse.
discovery_port = 8788

[storage]
; Где хранить историю этого компьютера.
; Можно указать, например: D:\ClipHouseHistory
; Или: %LOCALAPPDATA%\ClipHouse
; Можно также указать относительный путь, например: History (рядом с ClipHouse.py).
history_dir = %LOCALAPPDATA%\ClipHouse
; Сколько последних записей хранить на каждом компьютере (от 1 до 500).
; Сейчас веб-страница обновляет историю целиком, поэтому не ставь огромное число.
max_history = 60

[clipboard]
; true = автоматически сохранять текст из системного буфера Windows.
; false = НЕ отслеживать системный буфер; добавлять текст через веб-страницу.
auto_capture = true
; Максимальная длина одной записи в символах (от 1 до 1000000).
max_text_chars = 100000
