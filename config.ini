; ClipHouse: настройки сервера и SQLite-истории
; Изменения применяются после перезапуска Start_ClipHouse.bat.

[server]
; HTTP-порт веб-страницы. Оставь 8787, если он свободен.
http_port = 8787
; UDP-порт обнаружения других компьютеров. Должен совпадать на всех ПК.
discovery_port = 8788

[storage]
; Каталог, в котором хранится SQLite база history.sqlite3.
; Например: D:\ClipHouseHistory
; Или: %LOCALAPPDATA%\ClipHouse
; Допустим относительный путь, например History (рядом с ClipHouse.py).
history_dir = %LOCALAPPDATA%\ClipHouse

[clipboard]
; true = автоматически сохранять текст из системного буфера Windows.
; false = добавлять текст вручную через веб-страницу.
auto_capture = true
; Максимальная длина одного текста в символах (от 1 до 1000000).
max_text_chars = 100000

[web]
; Короткое имя для домашней DNS-записи на роутере.
; Это НЕ настраивает DNS автоматически — смотри README_RU.txt.
; Примеры: clip.home, clipboard или clip.home.arpa
; Для короткой закладки DNS-запись на Keenetic настраивается отдельно.
local_name = clip.home
